# CapRover/Docker: bez access logów (healthchecki, assety, boty = spam w logach)
access_log off;
error_log /dev/stderr warn;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /bannerfaceitobs {
        return 301 /wiki/bannerfaceit/;
    }

    location = /bannerfaceitobs/ {
        return 301 /wiki/bannerfaceit/;
    }

    location = /wiki {
        return 301 /wiki/;
    }

    location /wiki/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /widget/ {
        try_files $uri $uri/ /widget/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
